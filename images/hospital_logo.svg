<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for medical cross -->
  <circle cx="25" cy="30" r="20" fill="#0077b6" opacity="0.1"/>
  
  <!-- Medical cross symbol -->
  <rect x="20" y="15" width="10" height="30" fill="#0077b6" rx="2"/>
  <rect x="10" y="25" width="30" height="10" fill="#0077b6" rx="2"/>
  
  <!-- Calendar icon for appointments -->
  <rect x="50" y="15" width="25" height="20" fill="#0077b6" rx="3"/>
  <rect x="50" y="15" width="25" height="8" fill="#023e8a" rx="3"/>
  <circle cx="55" cy="19" r="1.5" fill="white"/>
  <circle cx="60" cy="19" r="1.5" fill="white"/>
  <circle cx="65" cy="19" r="1.5" fill="white"/>
  <circle cx="70" cy="19" r="1.5" fill="white"/>
  
  <!-- Calendar lines -->
  <line x1="52" y1="28" x2="73" y2="28" stroke="#023e8a" stroke-width="1"/>
  <line x1="52" y1="32" x2="73" y2="32" stroke="#023e8a" stroke-width="1"/>
  
  <!-- Text: Hospital -->
  <text x="85" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0077b6">Hospital</text>
  
  <!-- Text: Appointment -->
  <text x="85" y="40" font-family="Arial, sans-serif" font-size="12" fill="#023e8a">Appointment</text>
  
  <!-- Text: System -->
  <text x="85" y="52" font-family="Arial, sans-serif" font-size="10" fill="#666">System</text>
  
  <!-- Decorative line -->
  <line x1="80" y1="45" x2="180" y2="45" stroke="#0077b6" stroke-width="0.5" opacity="0.3"/>
</svg> 